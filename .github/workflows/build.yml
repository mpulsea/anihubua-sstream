name: Build AniHub Repository

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'repo.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anihub-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build repository
        run: |
          npm install -g skystream-cli

          cp anihub/plugin.js /tmp/anihub-plugin.js

          # iOS/FENIX v16: fetch the real HLS playlist inside the plugin, choose the
          # best variant, absolutize every segment/key/map URL and proxy each byte
          # resource. This avoids AVPlayer resolving relative paths against the
          # local proxy URL and avoids relying on it to forward provider headers.
          node - <<'NODE'
          const fs = require('fs');
          const file = 'anihub/plugin.js';
          let s = fs.readFileSync(file, 'utf8');
          s = s.replace(/AniHub v14/g, 'AniHub v16').replace(/V14 /g, 'V16 ');

          const needle = "async function addChecked(out,u,label,ref,diag){u=dec(String(u||'')).trim().replace(/\\\\\\//g,'/');var p=await probe(u,ref);diag.push(label+' '+host(u)+' p='+p.status+' '+p.why);if(p.ok)out.push(new StreamResult({url:u,source:'V16 '+label,headers:headers(ref)}))}";

          const helper = String.raw`function b64ascii(s){return btoa(String(s||'').replace(/[^\x00-\xFF]/g,''))}
function magicByte(u){return'MAGIC_PROXY_v1'+b64ascii(u)}
function playlistAbs(u,base){try{return new URL(dec(u),base).toString()}catch(e){return u}}
function rewriteMediaPlaylist(body,base){var ls=String(body||'').split(/\r?\n/),o=[];for(var i=0;i<ls.length;i++){var line=ls[i];if(!line){o.push(line);continue}if(line.charAt(0)==='#'){line=line.replace(/URI=(['"])(.*?)\1/g,function(_,q,v){return'URI='+q+magicByte(playlistAbs(v,base))+q});o.push(line);continue}o.push(magicByte(playlistAbs(line.trim(),base)))}return o.join('\n')}
async function fenixMagic(u,ref,diag){var r=await raw(u,H(ref,'application/vnd.apple.mpegurl,application/x-mpegURL,text/plain,*/*')),body=String(r.body||''),base=u;if(body.indexOf('#EXTM3U')<0)return magicByte(u);var ls=body.split(/\r?\n/),best=null;for(var i=0;i<ls.length;i++){if(/^#EXT-X-STREAM-INF:/i.test(ls[i])){var bw=(ls[i].match(/BANDWIDTH=(\d+)/i)||[])[1],j=i+1;while(j<ls.length&&(!ls[j]||ls[j].charAt(0)==='#'))j++;if(j<ls.length){var cand={u:playlistAbs(ls[j].trim(),u),bw:parseInt(bw||'0',10)||0};if(!best||cand.bw>best.bw)best=cand}}}if(best){var vr=await raw(best.u,H(ref,'application/vnd.apple.mpegurl,application/x-mpegURL,text/plain,*/*'));if(String(vr.body||'').indexOf('#EXTM3U')>=0){body=String(vr.body);base=best.u;diag.push('FENIX variant '+host(best.u)+' bw='+best.bw)}}var rewritten=rewriteMediaPlaylist(body,base);diag.push('FENIX magic media bytes='+rewritten.length);return'magic_m3u8:'+b64ascii(rewritten)}
async function addChecked(out,u,label,ref,diag){u=dec(String(u||'')).trim().replace(/\\\//g,'/');var p=await probe(u,ref);diag.push(label+' '+host(u)+' p='+p.status+' '+p.why);if(p.ok){var finalUrl=label.indexOf('FENIX')===0?await fenixMagic(u,ref,diag):u;out.push(new StreamResult({url:finalUrl,source:'V16 '+label,headers:label.indexOf('FENIX')===0?{}:headers(ref)}))}}`;

          if (!s.includes(needle)) throw new Error('v16 addChecked patch target not found');
          s = s.replace(needle, helper);
          fs.writeFileSync(file, s);
          NODE

          cat anihub/recommendations.js >> anihub/plugin.js
          skystream deploy -u https://raw.githubusercontent.com/${{ github.repository }}/main
          mv /tmp/anihub-plugin.js anihub/plugin.js

          VERSION=$(node -p "require('./anihub/plugin.json').version")

          find dist -maxdepth 1 -type f -name 'com.anva.anihub-v*.sky' -delete
          rm -rf anihub/.build

          cp dist/com.anva.anihub.sky "dist/com.anva.anihub-v${VERSION}.sky"

          node - <<'NODE'
          const fs = require('fs');
          const version = require('./anihub/plugin.json').version;
          const packageUrl = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/main/dist/com.anva.anihub-v${version}.sky`;
          const file = 'dist/plugins.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const plugin of data) {
            if (plugin.packageName === 'com.anva.anihub') {
              plugin.version = version;
              plugin.url = packageUrl;
            }
          }
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Commit generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: build AniHub repository [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
